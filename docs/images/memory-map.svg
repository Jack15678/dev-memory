<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Dev Memory: three documents, one place for each fact</title>
  <desc id="desc">The agent routes changes to HISTORY, lasting choices to DECISIONS, and reusable lessons to KNOWLEDGE. Relevant entries reference each other. Code and records are committed together after a coherent task is verified.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#54655e" stroke-width="1.4"/></marker>
  </defs>
  <rect width="1200" height="570" rx="24" fill="#f5f6f0"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="48" y="50" font-size="14" font-weight="700" letter-spacing="3" fill="#49715a">DEV MEMORY / 01</text>
    <text x="48" y="102" font-size="38" font-weight="700" fill="#1c3026">Keep the reason beside the code.</text>
    <text x="48" y="136" font-size="19" fill="#54655e">The agent records valuable information as it appears. One fact has one home.</text>
    <g transform="translate(48 176)">
      <rect width="352" height="220" rx="16" fill="#fff" stroke="#d3ddd6"/>
      <rect x="0" y="0" width="352" height="7" rx="3" fill="#3b7955"/>
      <text x="24" y="47" font-size="15" font-weight="700" fill="#3b7955">HISTORY.md</text>
      <text x="24" y="87" font-size="28" font-weight="700" fill="#1c3026">What changed?</text>
      <text x="24" y="127" font-size="18" fill="#54655e">Behavior, attempts, test results</text>
      <text x="24" y="157" font-size="18" fill="#54655e">and the corresponding version.</text>
      <text x="24" y="197" font-size="16" font-family="Consolas,monospace" fill="#3b7955">H-012 → decision D-004</text>
    </g>
    <g transform="translate(424 176)">
      <rect width="352" height="220" rx="16" fill="#fff" stroke="#d3ddd6"/>
      <rect x="0" y="0" width="352" height="7" rx="3" fill="#b87836"/>
      <text x="24" y="47" font-size="15" font-weight="700" fill="#996026">DECISIONS.md</text>
      <text x="24" y="87" font-size="28" font-weight="700" fill="#1c3026">Why this design?</text>
      <text x="24" y="127" font-size="18" fill="#54655e">Constraints, tradeoffs, hardcoding</text>
      <text x="24" y="157" font-size="18" fill="#54655e">and when to revisit a choice.</text>
      <text x="24" y="197" font-size="16" font-family="Consolas,monospace" fill="#996026">D-004 → code path + rationale</text>
    </g>
    <g transform="translate(800 176)">
      <rect width="352" height="220" rx="16" fill="#fff" stroke="#d3ddd6"/>
      <rect x="0" y="0" width="352" height="7" rx="3" fill="#52759d"/>
      <text x="24" y="47" font-size="15" font-weight="700" fill="#52759d">KNOWLEDGE.md</text>
      <text x="24" y="87" font-size="28" font-weight="700" fill="#1c3026">What can we reuse?</text>
      <text x="24" y="127" font-size="18" fill="#54655e">Useful lessons and ideas,</text>
      <text x="24" y="157" font-size="18" fill="#54655e">with evidence and limits.</text>
      <text x="24" y="197" font-size="16" font-family="Consolas,monospace" fill="#52759d">No new lesson? Leave it alone.</text>
    </g>
    <path d="M224 397V423H976V397M600 423V446" fill="none" stroke="#54655e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="246" y="458" width="708" height="64" rx="14" fill="#1c3026"/>
    <text x="600" y="485" font-size="20" font-weight="600" text-anchor="middle" fill="#fff">A coherent task + appropriate checks → local Git commit</text>
    <text x="600" y="510" font-size="16" text-anchor="middle" fill="#c8d8cc">Code and relevant records together. Unrelated changes stay out.</text>
    <text x="600" y="551" font-size="14" text-anchor="middle" fill="#54655e">Hooks prompt a check. The current agent decides what to record and when the task is complete.</text>
  </g>
</svg>
